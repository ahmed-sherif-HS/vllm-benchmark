# Benchmark a vLLM GPU deployment.
label: gpu
endpoint:
  base_url: http://localhost:8000/v1
  model: null
  api_key: EMPTY
  timeout_s: 600
  extra_body:
    ignore_eos: true
sweep:
  concurrency: [1, 2, 4, 8, 16, 32, 64]
  input_tokens: [128, 512, 1024, 2048]
  output_tokens: [64, 256, 512]
  requests_per_user: 4
  warmup_requests: 2
  temperature: 0.0
output:
  dir: results
  plots: true
