# GPU launch for the model on the vast.ai instance.
# Verified 2026-11-01: /v1/models returned id Qwen/Qwen3.5-9B and max_model_len 32000.
# These flags are the same string stored on configs/campaign.yaml gpu.launch_args.
model: Qwen/Qwen3.5-9B
image: vastai/vllm_v0.32.0-cuda-13.0/jupyter
dtype: auto
max_model_len: 32000
args: >-
  --max-num-seqs 8 --max-model-len 32000
  --enable-auto-tool-choice --tool-call-parser qwen3_coder
  --reasoning-parser qwen3 --download-dir /workspace/models
  --host 127.0.0.1 --port 18000
