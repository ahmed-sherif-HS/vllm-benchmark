<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vllm-bench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238c3a1e'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia' font-size='14' fill='%23faf7f2'%3Evb%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">vb</span>
      <div>
        <strong>vllm-bench</strong>
        <span>Same grid on GPU and CPU</span>
      </div>
    </div>
    <p class="top-note" id="status">Loading runs</p>
  </header>
  <div class="shell">
    <aside>
      <h2>Runs</h2>
      <div id="runs" class="runs"></div>
    </aside>
    <main id="main">
      <p class="empty">Loading the run.</p>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
