[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-bench"
version = "0.1.0"
description = "Latency/throughput benchmark for OpenAI-compatible LLM/VLM endpoints (vLLM on CPU or GPU) across users x input length x output length."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8", "numpy>=1.26"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
vllm-bench = "vllm_bench.cli:main"

[tool.setuptools.packages.find]
include = ["vllm_bench*"]

[tool.setuptools.package-data]
vllm_bench = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
